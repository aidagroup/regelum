[project]
name = "regelum"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anton Bolychev", email = "bolychev.anthon@yandex.ru" }
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "casadi>=3.7.2",
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "scienceplots>=2.1.1",
    "scipy>=1.17.1",
    "z3-solver>=4.16.0.0",
]

[project.scripts]
regelum-controlled-pendulum = "examples.controlled_pendulum.standalone:main"
regelum-free-pendulum = "examples.free_pendulum.standalone:main"
regelum-instance-connect = "examples.instance_connect.instance_connect:main"
regelum-simulink-feedback-loop = "examples.xcos_loop_resolving.regelum:main"
regelum-two-inverter-static-droop = "examples.two_inverter_static_droop.standalone:main"
regelum-video-player = "examples.video_player.video_player:main"

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "examples/two_inverter_static_droop/archive",
]

[tool.hatch.build.targets.sdist]
only-include = ["src", "examples", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/regelum", "examples"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/regelum/_version.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mike>=2.1.3",
    "marimo>=0.23.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.13"
